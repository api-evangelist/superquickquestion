name: SuperQuickQuestion
description: >-
  SuperQuickQuestion (SQQ) is a fan-engagement platform that hosts brief, 60-second
  one-on-one live video interactions between fans and celebrities, athletes, and
  musicians. It is web-based with no app download required, uses industry-standard
  encryption, and removes traditional event logistics (travel, hotels, agent
  back-and-forth) so talent only needs WiFi and a camera device while fans receive
  brand- or team-sponsored free access. Early clients include professional sports
  organizations such as the Washington Wizards, Cleveland Browns, Washington
  Mystics, Wrexham AFC, and talent like Ric Flair. No public API, developer portal,
  or SDK surface is currently published; this remains a consumer product profile.
